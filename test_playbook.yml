---

- name: Iam_linux playbook
  hosts: all
  pre_tasks:
    - name: Set ansible_user to root if init var is true
      ansible.builtin.set_fact:
        ansible_user: "{{ iam_linux_user }}"
      when: init_var | bool
  roles:
    - role: ../asbl-iam_linux
      become: true
      become_user: "{{ iam_linux_user }}"
      tags: [iam_linux]
