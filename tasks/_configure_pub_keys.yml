---
# Description : configure the public ssh keys
# file : _configure_pub_keys.yml

- name: Set up multiple authorized keys
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    state: present
    exclusive: true
    key: "{{ item.ssh_public_keys | join('\n') }}"
  with_items: "{{ users_to_add }}"
  when: users_to_add is iterable and item.ssh_public_keys | length > 0

- name: Set up authorized key for root user
  ansible.posix.authorized_key:
    user: "{{ root_user.name }}"
    state: present
    exclusive: true
    key: "{{ root_user.ssh_public_keys | join('\n') }}"
  when: root_user is defined and set_root_user_flag and root_user.ssh_public_keys | length > 0
